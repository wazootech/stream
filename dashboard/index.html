<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream dashboard</title>
    <link rel="stylesheet" href="session.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <script src="session.js" defer></script>
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <p id="message" role="status">Connecting...</p>

    <main>
      <section id="timer">
        <div class="head">
          <h2>Timer</h2>
          <div class="clock" id="clock">--:--</div>
        </div>
        <p class="now" id="now-timer"></p>
        <div class="bar"><i id="bar"></i></div>
        <form class="row" data-command="timer">
          <input
            class="minutes"
            type="number"
            min="0.1"
            max="1440"
            step="any"
            value="25"
            required
            aria-label="Timer minutes"
          />
          <input type="text" placeholder="Label (Focus)" aria-label="Timer label" />
          <button class="primary">Start</button>
        </form>
        <form class="row" data-command="break">
          <input
            class="minutes"
            type="number"
            min="0.1"
            max="1440"
            step="any"
            value="5"
            required
            aria-label="Break minutes"
          />
          <button class="grow" title="Switch to the Break scene in OBS">Break</button>
          <button type="button" id="timer-stop" data-command="timer stop">Stop</button>
        </form>
      </section>

      <section>
        <h2>Goal</h2>
        <p class="now" id="now-goal"></p>
        <form class="row" data-command="goal">
          <input type="text" required placeholder="New goal" aria-label="Goal" />
          <button class="primary">Set</button>
        </form>
        <h2>Title</h2>
        <p class="now" id="now-title"></p>
        <form class="row" data-command="title">
          <input type="text" required placeholder="New title" aria-label="Title" />
          <button class="primary">Set</button>
        </form>
      </section>

      <section>
        <h2>Tasks</h2>
        <ul class="tasks" id="tasks"></ul>
        <form class="row" data-command="task add">
          <input type="text" required placeholder="New task" aria-label="Task" />
          <button class="primary">Add</button>
        </form>
        <div class="confirm">
          <button type="button" data-arm>Clear tasks</button>
          <div hidden data-armed>
            <button type="button" data-cancel>Cancel</button>
            <button type="button" class="danger" data-command="task clear">
              Confirm clear tasks
            </button>
          </div>
        </div>
      </section>

      <section>
        <h2>Music label</h2>
        <p class="now" id="now-music"></p>
        <div class="pair">
          <button type="button" data-command="music StreamBeats - Electric">
            StreamBeats - Electric
          </button>
          <button type="button" data-command="music off">Off</button>
        </div>
      </section>

      <section>
        <h2>Chat on screen</h2>
        <div class="pair">
          <button type="button" data-command="chat test">Test</button>
          <button type="button" data-command="chat clear">Clear</button>
        </div>
      </section>

      <section>
        <h2>Alerts</h2>
        <p class="hint" id="alert-count"></p>
        <div class="pair">
          <button type="button" data-command="alert test">Test</button>
          <button type="button" data-command="alert clear">Clear</button>
        </div>
      </section>

      <section>
        <details>
          <summary>Current status</summary>
          <pre id="status"></pre>
        </details>
        <div class="confirm">
          <button type="button" data-arm>Reset session</button>
          <div hidden data-armed>
            <button type="button" data-cancel>Cancel</button>
            <button type="button" class="danger" data-command="reset">
              Confirm reset
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
