<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alerts</title>
    <link rel="stylesheet" href="session.css" />
    <style>
      /* 1920x1080, fully transparent until an alert plays. */
      .alert {
        position: fixed;
        top: 48px;
        left: 50%;
        width: max-content;
        min-width: 520px;
        max-width: 1100px;
        padding: 22px 40px;
        text-align: center;
        background: var(--panel);
        border: 3px solid var(--accent);
        border-radius: 8px;
        opacity: 0;
        transform: translate(-50%, -32px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }
      .alert.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #kind {
        font-size: 22px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      #name {
        font-size: 56px;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      #detail {
        font-size: 28px;
        color: var(--muted);
        min-height: 1.3em;
      }
    </style>
  </head>
  <body>
    <div class="alert" id="alert" aria-live="polite">
      <div id="kind"></div>
      <div id="name"></div>
      <div id="detail"></div>
    </div>

    <script src="session.js"></script>
    <script src="alerts.js"></script>
  </body>
</html>
